<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#54781A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="STEL Weed ID">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./favicon.png" sizes="64x64">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>STEL Weed ID</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Narrow:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
/* ─────────── tokens: shared with the STEL Quote Builder ─────────── */
:root{
  --ground:#F1F3EC; --surface:#FFFFFF; --sunk:#E5E8DD;
  --ink:#1A1E17; --ink-soft:#5B6356; --ink-faint:#88907F;
  --rule:#D3D8C8; --rule-hard:#B9C0AC;
  --accent:#54781A; --accent-ink:#FFFFFF; --accent-soft:#E9F0D7; --accent-edge:#B7CE7E;
  --warn:#9A5410; --warn-soft:#FAEDDC; --warn-edge:#E0B37C;
  --kind-insect:#8A5A1B; --kind-insect-edge:#D9B57E;
  --kind-disease:#6A4A8A; --kind-disease-edge:#BDA8D4;
  --shadow:0 1px 2px rgba(26,30,23,.05), 0 6px 18px -10px rgba(26,30,23,.22);
  --radius:3px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#11140D; --surface:#1A1E14; --sunk:#0C0F08;
    --ink:#E7EBDD; --ink-soft:#9AA38C; --ink-faint:#6E7764;
    --rule:#2C3222; --rule-hard:#3E462F;
    --accent:#A6C64C; --accent-ink:#11140D; --accent-soft:#222B12; --accent-edge:#4C5B26;
    --warn:#E39B45; --warn-soft:#2E2010; --warn-edge:#5E441F;
    --kind-insect:#D9A055; --kind-insect-edge:#6B4A20;
    --kind-disease:#B79BD6; --kind-disease-edge:#4A3A61;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px -10px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --ground:#11140D; --surface:#1A1E14; --sunk:#0C0F08;
  --ink:#E7EBDD; --ink-soft:#9AA38C; --ink-faint:#6E7764;
  --rule:#2C3222; --rule-hard:#3E462F;
  --accent:#A6C64C; --accent-ink:#11140D; --accent-soft:#222B12; --accent-edge:#4C5B26;
  --warn:#E39B45; --warn-soft:#2E2010; --warn-edge:#5E441F;
  --kind-insect:#D9A055; --kind-insect-edge:#6B4A20;
  --kind-disease:#B79BD6; --kind-disease-edge:#4A3A61;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px -10px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"Archivo","Segoe UI",system-ui,sans-serif;
  font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:contain;
}

/* ─────────── shell ─────────── */
.wrap{max-width:820px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
.mast{
  position:sticky;top:0;z-index:20;background:var(--ground);
  padding:calc(14px + env(safe-area-inset-top)) 0 12px;
  border-bottom:2px solid var(--rule-hard);
  display:flex;align-items:center;gap:12px;
}
.mast-mark{font-family:"Archivo Narrow","Archivo",sans-serif;font-weight:700;font-size:19px;letter-spacing:.18em;color:var(--accent);white-space:nowrap}
.mast-title{font-family:"Archivo Narrow","Archivo",sans-serif;font-weight:600;font-size:19px;letter-spacing:-.01em;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mast-btn{
  flex:0 0 auto;appearance:none;border:1px solid var(--rule-hard);background:var(--surface);color:var(--ink-soft);
  border-radius:2px;padding:7px 10px;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.06em;
  text-transform:uppercase;cursor:pointer;
}
.mast-btn:active{background:var(--sunk)}

.back{
  appearance:none;background:none;border:0;color:var(--accent);cursor:pointer;padding:14px 0 4px;
  font-family:"IBM Plex Mono",monospace;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;
  display:flex;align-items:center;gap:7px;
}
.back::before{content:"←";font-size:15px}

section{padding-top:18px;display:flex;flex-direction:column;gap:16px}
h2.sec{margin:0;font-family:"Archivo Narrow","Archivo",sans-serif;font-weight:600;font-size:12px;
  letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius);box-shadow:var(--shadow)}
.hint{font-size:13.5px;color:var(--ink-faint);line-height:1.45;margin:0}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}

/* ─────────── search ─────────── */
.search{position:relative}
.search input{
  width:100%;font-size:17px;color:var(--ink);background:var(--surface);
  border:1px solid var(--rule-hard);border-radius:2px;padding:15px 14px 15px 42px;
  font-family:"Archivo",sans-serif;
}
.search svg{position:absolute;left:14px;top:50%;margin-top:-9px;width:18px;height:18px;
  stroke:var(--ink-faint);fill:none;stroke-width:2;pointer-events:none}
input:focus-visible,select:focus-visible,button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input::placeholder{color:var(--ink-faint)}

/* ─────────── buttons ─────────── */
.btn{
  appearance:none;width:100%;display:block;text-align:center;text-decoration:none;
  font-family:"Archivo Narrow","Archivo",sans-serif;font-weight:600;font-size:17px;letter-spacing:.02em;
  padding:15px 18px;border-radius:2px;cursor:pointer;border:1px solid var(--accent);
  background:var(--accent);color:var(--accent-ink);line-height:1.25;
}
.btn:active{filter:brightness(.93)}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--rule-hard)}
.btn.ghost:active{background:var(--sunk)}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn-sub{display:block;font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.06em;
  text-transform:uppercase;opacity:.8;font-weight:400;margin-top:3px}

/* the two home buttons: thumb-sized, readable at arms length in the sun */
.btn.huge{padding:26px 18px;font-size:20px;line-height:1.15}
.btn.huge .huge-t{display:block;font-size:26px;font-weight:700;letter-spacing:.01em;margin-top:6px}
.btn.huge .btn-sub{font-size:11.5px;margin-top:7px}
.more-toggle{
  appearance:none;display:block;width:100%;background:none;border:0;cursor:pointer;
  font-family:"IBM Plex Mono",monospace;font-size:11.5px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink-faint);padding:14px 8px;
}
.more-toggle:active{color:var(--ink)}

/* ─────────── lists ─────────── */
.list{list-style:none;margin:0;padding:0}
.item{
  display:block;width:100%;text-align:left;appearance:none;background:var(--surface);
  border:0;border-top:1px solid var(--rule);padding:15px 16px;cursor:pointer;color:inherit;font:inherit;
}
.list .item:first-child{border-top:0}
.item:active{background:var(--sunk)}
.item-name{font-family:"Archivo Narrow","Archivo",sans-serif;font-weight:600;font-size:17px;line-height:1.25}
.item-meta{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-faint);letter-spacing:.03em;margin-top:4px;
  display:flex;flex-wrap:wrap;gap:4px 10px}
.item-sci{font-style:italic;color:var(--ink-soft);font-size:13.5px;margin-top:3px}
.count{flex:0 0 auto;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--accent);
  background:var(--accent-soft);border:1px solid var(--accent-edge);border-radius:2px;padding:2px 6px}
.item-row{display:flex;align-items:flex-start;gap:12px}
.item-row > div:first-child{flex:1;min-width:0}

/* ─────────── chips ─────────── */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;margin:0 -16px;padding-left:16px;padding-right:16px;
  scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;appearance:none;cursor:pointer;border:1px solid var(--rule-hard);background:var(--surface);
  color:var(--ink-soft);border-radius:999px;padding:9px 14px;font-size:14px;font-family:"Archivo",sans-serif;
  white-space:nowrap;
}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.chip .cn{font-family:"IBM Plex Mono",monospace;font-size:11px;opacity:.75;margin-left:6px}

/* ─────────── the standing safety line ─────────── */
.safety{
  display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:2px;font-size:13.5px;line-height:1.45;
  background:var(--warn-soft);border-left:3px solid var(--warn-edge);color:var(--ink);
}
.safety b{color:var(--warn)}
.safety-tag{flex:0 0 auto;font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--warn);padding-top:3px;font-weight:600}

/* ─────────── weed / product detail ─────────── */
.hero{padding:18px 16px;border-bottom:1px solid var(--rule)}
.hero h1{margin:0;font-family:"Archivo Narrow","Archivo",sans-serif;font-weight:600;
  font-size:clamp(24px,6vw,32px);line-height:1.08;letter-spacing:-.015em;text-wrap:balance}
.hero .sci{margin:6px 0 0;font-style:italic;color:var(--ink-soft);font-size:15px}
.hero .also{margin:8px 0 0;font-size:13px;color:var(--ink-faint);line-height:1.45}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;padding:16px;font-size:14px;align-items:baseline}
.kv dt{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-soft);white-space:nowrap}
.kv dd{margin:0}
.actives{display:flex;flex-wrap:wrap;gap:6px}
.active{font-family:"IBM Plex Mono",monospace;font-size:12px;background:var(--sunk);border:1px solid var(--rule);
  border-radius:2px;padding:3px 7px}
.grp-head{padding:12px 16px 6px;font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--accent);background:var(--surface);border-top:1px solid var(--rule)}
.list .grp-head:first-child{border-top:0}

/* Apparent leads; every other brand sits behind the reveal button */
.brand-head{padding:13px 16px;font-family:"Archivo Narrow","Archivo",sans-serif;font-weight:700;
  font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);
  background:var(--accent);border-radius:var(--radius) var(--radius) 0 0}
.brand-none{padding:14px 16px;font-size:14.5px;line-height:1.5;color:var(--ink);
  background:var(--warn-soft);border-left:3px solid var(--warn-edge);
  border-radius:var(--radius) var(--radius) 0 0}
.brand-none b{color:var(--warn)}
.btn.reveal{border-radius:0;border-left:0;border-right:0;border-bottom:0;font-size:15px;padding:14px}
.tag{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.05em;text-transform:uppercase;
  border:1px solid var(--rule-hard);border-radius:2px;padding:1px 5px;color:var(--ink-faint)}
.tag.qld{color:var(--accent);border-color:var(--accent-edge);background:var(--accent-soft)}
.tag.expired{color:var(--warn);border-color:var(--warn-edge);background:var(--warn-soft)}
/* what you are trying to kill, and what sort of product does it */
.tag.kind-weed{color:var(--accent);border-color:var(--accent-edge)}
.tag.kind-insect{color:var(--kind-insect);border-color:var(--kind-insect-edge)}
.tag.kind-disease{color:var(--kind-disease);border-color:var(--kind-disease-edge)}
.tag.kind-growth{color:var(--ink-soft)}
.tag.type-pest{color:var(--ink-soft);border-color:var(--rule-hard);background:var(--sunk)}
.tag.type-tank{color:var(--kind-insect);border-color:var(--kind-insect-edge)}
.tag.type-growth{color:var(--kind-disease);border-color:var(--kind-disease-edge)}

/* ─────────── identify ─────────── */
.cands{display:flex;flex-direction:column;gap:0}
.cand{display:flex;gap:13px;padding:14px 16px;border-top:1px solid var(--rule);align-items:flex-start;
  width:100%;text-align:left;appearance:none;background:var(--surface);border-left:0;border-right:0;border-bottom:0;
  cursor:pointer;color:inherit;font:inherit}
.cand:first-child{border-top:0}
.cand:active{background:var(--sunk)}
.cand img{flex:0 0 auto;width:64px;height:64px;object-fit:cover;border-radius:2px;background:var(--sunk);border:1px solid var(--rule)}
.cand-body{flex:1;min-width:0}
.score{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-faint)}
.bar{height:3px;background:var(--sunk);border-radius:2px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent)}
.nomatch{padding:14px 16px;border-top:1px solid var(--rule);font-size:13.5px;color:var(--ink-faint);line-height:1.45}
.preview{width:100%;max-height:260px;object-fit:cover;border-radius:2px;border:1px solid var(--rule);display:block}
/* File inputs must stay in the layout to be clickable from script — mobile
   Safari ignores .click() on a display:none input. Hide them visually only. */
.filepick{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0;opacity:0}

/* ─────────── misc ─────────── */
.empty{padding:28px 16px;text-align:center;color:var(--ink-faint);font-size:14px;line-height:1.5}
.spin{display:inline-block;width:15px;height:15px;border:2px solid var(--accent-edge);border-top-color:var(--accent);
  border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.loading{padding:26px 16px;text-align:center;color:var(--ink-soft);font-size:14px}
.field{display:flex;flex-direction:column;gap:7px;padding:16px}
.field label{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.field input, .field select{width:100%;font-family:"IBM Plex Mono",monospace;font-size:14px;color:var(--ink);
  background:var(--sunk);border:1px solid var(--rule);border-radius:2px;padding:11px 12px}
.foot{padding:26px 0 8px;font-size:12px;color:var(--ink-faint);line-height:1.55;text-align:center}
.foot a{color:var(--ink-soft)}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--ink);color:var(--ground);padding:11px 18px;border-radius:3px;font-size:14px;z-index:60;
  box-shadow:var(--shadow);max-width:calc(100vw - 32px);text-align:center}
</style>
</head>
<body>

<div class="wrap">
  <header class="mast">
    <span class="mast-mark">STEL</span>
    <span class="mast-title" id="mastTitle">Weed ID</span>
    <button class="mast-btn" id="btnSettings" type="button">Setup</button>
  </header>

  <main id="app"><div class="loading"><span class="spin"></span> Loading chemical data…</div></main>

  <p class="foot">
    Product and label data from the <a href="https://www.apvma.gov.au/" target="_blank" rel="noopener">APVMA</a>
    PubCRIS open dataset (CC BY 3.0 AU). Identification by
    <a href="https://plantnet.org/" target="_blank" rel="noopener">Pl@ntNet</a>.<br>
    <span id="footMeta" class="mono"></span>
  </p>
</div>

<script>
"use strict";

/* ═══════════════════════════════════════════════════════════════════════
   STEL Weed ID

   Photograph a weed, find every herbicide registered for it in Australia,
   open the approved APVMA label.

   Three things this app deliberately does NOT do:
     1. State an application rate. PubCRIS does not publish rates and a wrong
        rate is an off-label offence. The label is one tap away and it is the
        legal document.
     2. Silently pick a weed from a photo. Candidates are always shown with
        their confidence for the operator to confirm.
     3. Claim a product is suitable for aerial/drone application. That is on
        the label too.
   ═══════════════════════════════════════════════════════════════════════ */

var DATA = null;       /* weeds, products, situations, index */
var DETAIL = null;     /* lazy: weed -> product -> host ids */
var HOSTS = null;      /* lazy: host descriptions */
var SCI = null;        /* scientific name -> [weed idx] */
var GENUS = null;      /* genus -> [weed idx] */

var LS_KEY = "stel-weed-key";
var LS_PROJ = "stel-weed-project";
var PROJ_DEFAULT = "all";   /* the only flora a free Pl@ntNet key is allowed to use.
   k-australia is a real flora and a better one, but it is not included in the free
   plan: the API answers 403 for it, which killed every identification on 2026-09-06.
   Setup now lists whatever THIS key can actually reach, read from /v2/projects. */
var LS_THEME = "stel-weed-theme";
var LS_RECENT = "stel-weed-recent";
var LS_MISS = "stel-weed-misses";

var app = document.getElementById("app");
var mastTitle = document.getElementById("mastTitle");

/* ─────────── small helpers ─────────── */
function el(tag, cls, txt){
  var n = document.createElement(tag);
  if(cls) n.className = cls;
  if(txt != null) n.textContent = txt;
  return n;
}
function ls(k, d){ try{ var v = localStorage.getItem(k); return v == null ? d : v; }catch(e){ return d; } }
function lsSet(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
function lsJson(k, d){ try{ return JSON.parse(localStorage.getItem(k)) || d; }catch(e){ return d; } }

var toastTimer = null;
function toast(msg){
  var t = document.querySelector(".toast");
  if(t) t.remove();
  t = el("div", "toast", msg);
  document.body.appendChild(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.remove(); }, 2600);
}

/* base-36 delta list -> array of ints. This is how index.json stays under a
   megabyte: product ids sorted, stored as gaps, written in base 36. */
function unpack(s){
  if(!s) return [];
  var parts = s.split(","), out = [], run = 0;
  for(var i = 0; i < parts.length; i++){
    run += parseInt(parts[i], 36);
    out.push(run);
  }
  return out;
}

/* ─────────── data ─────────── */
function getJSON(url){
  return fetch(url, {cache: "no-cache"}).then(function(r){
    if(!r.ok) throw new Error(url + " -> " + r.status);
    return r.json();
  });
}

function loadCore(){
  return Promise.all([
    getJSON("./data/targets.json"),
    getJSON("./data/products.json"),
    getJSON("./data/situations.json"),
    getJSON("./data/index.json"),
    getJSON("./data/meta.json")
  ]).then(function(r){
    DATA = {
      targets: r[0].targets,
      products: r[1].products,
      groups: r[2].groups,
      idx: r[3].idx,
      meta: r[4]
    };
    buildSciIndex();
    var m = DATA.meta;
    document.getElementById("footMeta").textContent =
      m.counts.products.toLocaleString() + " products · " +
      m.counts.weeds.toLocaleString() + " weeds · " +
      m.counts.insects.toLocaleString() + " insects · " +
      m.counts.diseases.toLocaleString() + " diseases · PubCRIS " + m.built;
  });
}

function buildSciIndex(){
  SCI = Object.create(null);
  GENUS = Object.create(null);
  for(var i = 0; i < DATA.targets.length; i++){
    var names = DATA.targets[i][3] || [];
    for(var j = 0; j < names.length; j++){
      var n = names[j];
      (SCI[n] || (SCI[n] = [])).push(i);
      var g = n.split(" ")[0];
      if(g){ (GENUS[g] || (GENUS[g] = [])).push(i); }
    }
  }
}

function needDetail(){
  if(DETAIL) return Promise.resolve();
  return Promise.all([
    getJSON("./data/detail.json"),
    getJSON("./data/hosts.json")
  ]).then(function(r){ DETAIL = r[0].detail; HOSTS = r[1].hosts; });
}

/* host -> everything registered on it, whatever the target. Answers
   "I'm standing in a macadamia block, what can I use here". */
var BYHOST = null;
function needByHost(){
  if(BYHOST) return Promise.resolve();
  return Promise.all([
    getJSON("./data/byhost.json"),
    HOSTS ? Promise.resolve({hosts: HOSTS}) : getJSON("./data/hosts.json")
  ]).then(function(r){ BYHOST = r[0].byhost; HOSTS = r[1].hosts; });
}

/* the three kinds of thing you can be trying to kill */
var KINDS = [
  {id: "weed",    label: "Weeds"},
  {id: "insect",  label: "Insects & mites"},
  {id: "disease", label: "Diseases"},
  {id: "growth",  label: "Crop growth"}
];
function kindLabel(k){
  for(var i = 0; i < KINDS.length; i++) if(KINDS[i].id === k) return KINDS[i].label;
  return k;
}

/* products registered for a weed, optionally narrowed to a situation group */
function productsFor(weedIdx, groupIdx){
  var byGroup = DATA.idx[String(weedIdx)];
  if(!byGroup) return [];
  if(groupIdx != null){ return unpack(byGroup[String(groupIdx)]); }
  var seen = Object.create(null), out = [];
  for(var g in byGroup){
    var ids = unpack(byGroup[g]);
    for(var i = 0; i < ids.length; i++){
      if(!seen[ids[i]]){ seen[ids[i]] = 1; out.push(ids[i]); }
    }
  }
  out.sort(function(a, b){ return a - b; });
  return out;
}

/* The reverse view: every weed a product is registered for. Built once from the
   forward index on first use — about 800k steps, a few hundred milliseconds,
   which is cheaper than shipping a second index. */
var REVERSE = null;
function targetsForProduct(pi){
  if(!REVERSE){
    REVERSE = Object.create(null);
    for(var w in DATA.idx){
      var byGroup = DATA.idx[w], seen = Object.create(null);
      for(var g in byGroup){
        var ids = unpack(byGroup[g]);
        for(var k = 0; k < ids.length; k++){
          var id = ids[k];
          if(seen[id]) continue;
          seen[id] = 1;
          (REVERSE[id] || (REVERSE[id] = [])).push(+w);
        }
      }
    }
  }
  return REVERSE[pi] || [];
}

/* which situation groups have anything for this weed, with counts */
function groupsFor(weedIdx){
  var byGroup = DATA.idx[String(weedIdx)] || {};
  var out = [];
  for(var gi = 0; gi < DATA.groups.length; gi++){
    var s = byGroup[String(gi)];
    if(s){ out.push({i: gi, id: DATA.groups[gi][0], name: DATA.groups[gi][1], n: s.split(",").length}); }
  }
  return out;
}

function labelUrl(pcode){ return "https://elabels.apvma.gov.au/" + pcode + "ELBL.pdf"; }

/* the crosswalk stores binomials lowercased for matching; genus is capitalised
   for display, as it is written */
function sciName(s){ return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }

function isExpired(d){
  /* expdate arrives as dd/mm/yyyy */
  var m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(d || "");
  if(!m) return false;
  return new Date(+m[3], +m[2] - 1, +m[1]) < new Date();
}

function activesLine(p){
  var a = p[4] || [];
  return a.map(function(x){ return x[0] + (x[1] ? " " + x[1] + " " + x[2] : ""); }).join(" + ");
}
/* The base actives with salts and esters stripped, used to group a product list.
   PubCRIS carries 2,4-D as six different salts; for choosing and rotating a mode
   of action they all belong under one heading. */
function activeKey(p){
  var a = p[4] || [];
  if(!a.length) return "Not stated";
  var seen = Object.create(null), out = [];
  a.forEach(function(x){
    var b = x[3] || x[0];
    if(!seen[b]){ seen[b] = 1; out.push(b); }
  });
  return out.join(" + ");
}

/* ─────────── search ─────────── */
function searchTargets(q, kind){
  q = q.trim().toLowerCase();
  if(q.length < 2) return [];
  var terms = q.split(/\s+/), out = [];
  for(var i = 0; i < DATA.targets.length; i++){
    var w = DATA.targets[i];
    if(kind && w[4] !== kind) continue;
    var hay = (w[1] + " " + (w[2] || []).join(" ") + " " + (w[3] || []).join(" ")).toLowerCase();
    var ok = true, score = 0;
    for(var t = 0; t < terms.length; t++){
      var at = hay.indexOf(terms[t]);
      if(at < 0){ ok = false; break; }
      score += at === 0 ? 0 : (at < 12 ? 2 : 6);
    }
    if(ok){
      if(w[1].toLowerCase().indexOf(q) === 0) score -= 10;
      out.push({i: i, s: score + w[1].length * 0.02});
    }
  }
  out.sort(function(a, b){ return a.s - b.s; });
  return out.slice(0, 60).map(function(x){ return x.i; });
}

function searchProducts(q){
  q = q.trim().toLowerCase();
  if(q.length < 2) return [];
  var out = [];
  for(var i = 0; i < DATA.products.length; i++){
    var p = DATA.products[i];
    var hay = (p[1] + " " + p[2] + " " + activeKey(p)).toLowerCase();
    var at = hay.indexOf(q);
    if(at >= 0) out.push({i: i, s: at});
  }
  out.sort(function(a, b){ return a.s - b.s; });
  return out.slice(0, 60).map(function(x){ return x.i; });
}

/* ─────────── recents ─────────── */
function pushRecent(weedIdx){
  var r = lsJson(LS_RECENT, []);
  r = r.filter(function(x){ return x !== weedIdx; });
  r.unshift(weedIdx);
  lsSet(LS_RECENT, JSON.stringify(r.slice(0, 12)));
}

/* Apparent is the brand Stuart buys, so it leads and every other brand sits
   behind one tap. Apparent is a Titan Ag brand, not a registrant, so the only
   reliable marker in PubCRIS is the product name. All 131 start with "Apparent ",
   and nothing else in the dataset has the word anywhere in its name. */
function isApparent(p){ return /^apparent\b/i.test(p[1] || ""); }

/* products grouped by active constituent, so modes of action can be rotated */
function groupedList(ids, weedIdx){
  var ul = el("ul", "list");
  var buckets = Object.create(null);
  ids.forEach(function(pi){
    var k = activeKey(DATA.products[pi]);
    (buckets[k] || (buckets[k] = [])).push(pi);
  });
  var keys = Object.keys(buckets).sort(function(a, b){
    return buckets[b].length - buckets[a].length || a.localeCompare(b);
  });
  keys.forEach(function(k){
    ul.appendChild(el("li", "grp-head", k + "  ·  " + buckets[k].length));
    buckets[k].sort(function(a, b){
      return DATA.products[a][1].localeCompare(DATA.products[b][1]);
    }).forEach(function(pi){ ul.appendChild(productRow(pi, weedIdx)); });
  });
  return ul;
}

/* Apparent first, everything else one tap away. Apparent covers 1,103 of the
   2,008 weeds, so "no Apparent product" is a normal answer, not a fault. It has
   to say so out loud: a blank screen would read as "nothing is registered". */
function productList(ids, weedIdx){
  var wrap = el("div");

  if(!ids.length){
    var u0 = el("ul", "list");
    u0.appendChild(el("li", "empty", "Nothing registered for this weed in that situation."));
    wrap.appendChild(u0);
    return wrap;
  }

  var mine = [], rest = [];
  ids.forEach(function(pi){ (isApparent(DATA.products[pi]) ? mine : rest).push(pi); });

  if(mine.length){
    wrap.appendChild(el("div", "brand-head", "Apparent  ·  " + mine.length));
    wrap.appendChild(groupedList(mine, weedIdx));
  } else {
    var none = el("div", "brand-none");
    none.innerHTML = "<b>No Apparent product for this one.</b> Below is every other "
      + "brand registered for it.";
    wrap.appendChild(none);
  }

  if(!rest.length) return wrap;

  if(!mine.length){ wrap.appendChild(groupedList(rest, weedIdx)); return wrap; }

  var label = rest.length + " other brand" + (rest.length === 1 ? "" : "s");
  var box = el("div");
  box.hidden = true;
  box.appendChild(groupedList(rest, weedIdx));
  var more = el("button", "btn ghost reveal");
  more.type = "button";
  more.textContent = "Show " + label;
  more.onclick = function(){
    box.hidden = !box.hidden;
    more.textContent = (box.hidden ? "Show " : "Hide ") + label;
  };
  wrap.appendChild(more);
  wrap.appendChild(box);
  return wrap;
}

  var panel = el("div", "panel");
  var ul = el("ul", "list");
  Object.keys(buckets).sort(function(a, b){
    return buckets[b].length - buckets[a].length || a.localeCompare(b);
  }).forEach(function(k){
    ul.appendChild(el("li", "grp-head", k + "  ·  " + buckets[k].length));
    buckets[k].sort(function(a, b){
      return DATA.products[a][1].localeCompare(DATA.products[b][1]);
    }).forEach(function(pi){ ul.appendChild(productRow(pi, null)); });
  });
  panel.appendChild(ul);
  s.appendChild(panel);
  app.appendChild(s);
}

/* ─────────── identify ─────────── */
function vIdentify(){
  mastTitle.textContent = "Identify";
  var s = el("section");
  s.appendChild(backBtn("Back", "home"));

  var key = ls(LS_KEY, "");
  if(!key){
    s.appendChild(el("h2", "sec", "One-time setup"));
    var p = el("div", "panel");
    p.appendChild(el("div", "empty",
      "Photo identification needs a free Pl@ntNet API key (500 identifications a day). "
      + "It is stored on this device only."));
    s.appendChild(p);
    var b = el("button", "btn");
    b.type = "button";
    b.textContent = "Add the key";
    b.onclick = function(){ go("settings"); };
    s.appendChild(b);
    app.appendChild(s);
    return;
  }

  s.appendChild(el("h2", "sec", "Photograph the weed"));
  s.appendChild(el("p", "hint",
    "Fill the frame with one part of the plant and say which part it is. "
    + "A clear leaf or flower beats a wide shot of the paddock every time."));

  var organ = {v: "auto"};
  var chips = el("div", "chips");
  [["auto", "Whole plant"], ["leaf", "Leaf"], ["flower", "Flower"],
   ["fruit", "Seed head / fruit"], ["bark", "Stem or bark"]].forEach(function(o){
    var c = el("button", "chip");
    c.type = "button";
    c.textContent = o[1];
    c.setAttribute("aria-pressed", organ.v === o[0] ? "true" : "false");
    c.onclick = function(){
      organ.v = o[0];
      Array.prototype.forEach.call(chips.children, function(x){ x.setAttribute("aria-pressed", "false"); });
      c.setAttribute("aria-pressed", "true");
    };
    chips.appendChild(c);
  });
  s.appendChild(chips);

  /* Two inputs, not one. "capture" forces the camera and REMOVES the option to
     pick an existing photo, so the roll needs its own input without it.
     Neither may be display:none — a hidden file input ignores a programmatic
     .click() on mobile Safari, which makes the button look broken. */
  var cam = el("input", "filepick");
  cam.type = "file";
  cam.accept = "image/*";
  cam.setAttribute("capture", "environment");
  s.appendChild(cam);

  var roll = el("input", "filepick");
  roll.type = "file";
  roll.accept = "image/*";
  s.appendChild(roll);

  var shoot = el("button", "btn");
  shoot.type = "button";
  shoot.innerHTML = "📷 Take a photo<span class='btn-sub'>opens the camera</span>";
  shoot.onclick = function(){ cam.click(); };
  s.appendChild(shoot);

  var pick = el("button", "btn ghost");
  pick.type = "button";
  pick.innerHTML = "Choose an existing photo<span class='btn-sub'>from the camera roll</span>";
  pick.onclick = function(){ roll.click(); };
  s.appendChild(pick);

  var out = el("div");
  s.appendChild(out);

  function handlePick(input){
    var f = input.files && input.files[0];
    /* clear it, or picking the same photo twice fires no change event at all */
    input.value = "";
    if(!f) return;
    out.innerHTML = "";
    var pv = el("img", "preview");
    pv.alt = "";
    pv.src = URL.createObjectURL(f);
    var pp = el("div", "panel");
    pp.appendChild(pv);
    out.appendChild(pp);
    var busy = el("div", "loading");
    busy.innerHTML = "<span class='spin'></span> Asking Pl@ntNet…";
    out.appendChild(busy);
    identify(f, organ.v, key).then(function(res){
      busy.remove();
      if(res.fellBack){
        var sw = el("div", "brand-none");
        sw.innerHTML = "<b>Switched back to the world flora.</b> This Pl@ntNet key is not "
          + "allowed to use the " + res.badProj + " flora, so the app has moved to one "
          + "that works. Nothing for you to do.";
        out.appendChild(sw);
      }
      out.appendChild(candidates(res.results));
    }).catch(function(err){
      busy.remove();
      var e = el("div", "panel");
      e.appendChild(el("div", "empty", String(err && err.message || err)));
      out.appendChild(e);
      var manual = el("button", "btn ghost");
      manual.type = "button";
      manual.textContent = "Search by name instead";
      manual.onclick = function(){ go("home"); };
      out.appendChild(manual);
    });
  }

  cam.onchange  = function(){ handlePick(cam); };
  roll.onchange = function(){ handlePick(roll); };

  app.appendChild(s);
}

function identify(fileBlob, organ, key, projOverride){
  var proj = projOverride || ls(LS_PROJ, PROJ_DEFAULT);
  var fd = new FormData();
  fd.append("images", fileBlob);
  fd.append("organs", organ);
  var url = "https://my-api.plantnet.org/v2/identify/" + encodeURIComponent(proj)
          + "?api-key=" + encodeURIComponent(key) + "&nb-results=5&lang=en";
  return fetch(url, {method: "POST", body: fd}).then(function(r){
    if(r.ok) return r.json().then(function(j){
      return {results: j.results || [], proj: proj, fellBack: false};
    });
    /* Read the body. Pl@ntNet puts a real reason in there, and throwing it away
       is what let a forbidden flora look like "nothing in that photo" for a day. */
    return r.text().then(function(body){
      var msg = "";
      try{ msg = String(JSON.parse(body).message || "").trim(); }catch(e){}
      if(r.status === 401) throw new Error("Pl@ntNet rejected the key. Check it under Setup.");
      if(r.status === 429) throw new Error("Daily Pl@ntNet limit reached (500/day). Search by name instead.");
      /* 403 means the key is fine but this flora is not in the plan. A 404 on a
         flora the key cannot see looks the same. Either way, drop to "all" once
         rather than telling the user their photo was no good. */
      if((r.status === 403 || r.status === 404) && proj !== "all"){
        var fb = new Error("flora-unavailable");
        fb.fallback = true;
        throw fb;
      }
      if(r.status === 404){
        throw new Error("Pl@ntNet did not recognise that photo. Try a closer shot of a "
          + "leaf or flower." + (msg ? " (" + msg + ")" : ""));
      }
      throw new Error("Pl@ntNet error " + r.status + (msg ? ": " + msg : "") + ".");
    });
  }).catch(function(err){
    if(!err || !err.fallback) throw err;
    lsSet(LS_PROJ, "all");                    /* remember, so it stops costing a call */
    return identify(fileBlob, organ, key, "all").then(function(res){
      res.fellBack = true;
      res.badProj = proj;
      return res;
    });
  });
}

/* Map a Pl@ntNet result onto PubCRIS weeds. Exact binomial first, then genus,
   then the common names it returns. Never picks silently. */
function matchWeeds(res){
  var sci = (res.species && res.species.scientificNameWithoutAuthor || "").toLowerCase();
  var bare = sci.split(" ").slice(0, 2).join(" ");
  if(SCI[bare]) return {how: "exact", ids: SCI[bare].slice()};
  if(SCI[sci]) return {how: "exact", ids: SCI[sci].slice()};
  var g = bare.split(" ")[0];
  if(g && GENUS[g]) return {how: "genus", ids: GENUS[g].slice()};
  var commons = (res.species && res.species.commonNames) || [];
  for(var i = 0; i < commons.length; i++){
    var hits = searchTargets(commons[i]);
    if(hits.length) return {how: "common", ids: hits.slice(0, 6), via: commons[i]};
  }
  return {how: "none", ids: []};
}

function logMiss(res){
  var name = res.species && res.species.scientificNameWithoutAuthor;
  if(!name) return;
  var m = lsJson(LS_MISS, []);
  if(m.indexOf(name) < 0){ m.unshift(name); lsSet(LS_MISS, JSON.stringify(m.slice(0, 40))); }
}

function candidates(results){
  var panel = el("div", "panel");
  if(!results.length){
    panel.appendChild(el("div", "empty", "Pl@ntNet did not recognise that. Try a closer photo of a leaf or flower."));
    return panel;
  }
  panel.appendChild(el("div", "grp-head", "Pl@ntNet's best guesses — pick the right one"));
  results.slice(0, 5).forEach(function(r){
    var m = matchWeeds(r);
    if(m.how === "none") logMiss(r);
    var sci = r.species && r.species.scientificNameWithoutAuthor || "?";
    var commons = (r.species && r.species.commonNames || []).slice(0, 2).join(", ");
    var pct = Math.round((r.score || 0) * 100);

    var b = el("button", "cand");
    b.type = "button";
    var img = r.images && r.images[0] && r.images[0].url && (r.images[0].url.s || r.images[0].url.m);
    if(img){
      var im = el("img");
      im.src = img; im.alt = ""; im.loading = "lazy";
      b.appendChild(im);
    }
    var body = el("div", "cand-body");
    body.appendChild(el("div", "item-name", commons || sci));
    body.appendChild(el("div", "item-sci", sci));

    var note;
    if(m.how === "exact")      note = "Matches " + DATA.targets[m.ids[0]][1];
    else if(m.how === "genus") note = "Genus match — " + m.ids.length + " related entr" + (m.ids.length === 1 ? "y" : "ies");
    else if(m.how === "common")note = "Matched on the name “" + m.via + "” — check it";
    else                       note = "Not in the APVMA weed list";

    var mt = el("div", "item-meta");
    mt.appendChild(el("span", null, note));
    body.appendChild(mt);

    var bar = el("div", "bar");
    var fill = el("i");
    fill.style.width = Math.max(3, pct) + "%";
    bar.appendChild(fill);
    body.appendChild(bar);
    body.appendChild(el("div", "score", pct + "% confident"));
    b.appendChild(body);

    if(m.ids.length === 1){
      b.onclick = function(){ go("weed", m.ids[0]); };
    } else if(m.ids.length > 1){
      b.onclick = function(){ showChoices(panel, m, sci); };
    } else {
      b.onclick = function(){ toast("No APVMA weed for " + sci + " — try searching by name"); };
    }
    panel.appendChild(b);
  });

  var foot = el("div", "nomatch");
  foot.textContent = "None of these right? Go back and search by name — you know the paddock "
    + "better than the model does.";
  panel.appendChild(foot);
  return panel;
}

function showChoices(panel, m, sci){
  var box = el("div");
  box.appendChild(el("div", "grp-head", "APVMA entries for " + sci));
  var ul = el("ul", "list");
  m.ids.slice(0, 12).forEach(function(i){ ul.appendChild(targetRow(i)); });
  box.appendChild(ul);
  panel.appendChild(box);
  box.scrollIntoView({behavior: "smooth", block: "nearest"});
}

/* ─────────── settings ─────────── */
function vSettings(){
  mastTitle.textContent = "Setup";
  var s = el("section");
  s.appendChild(backBtn("Back", "home"));

  s.appendChild(el("h2", "sec", "Pl@ntNet key"));
  var p1 = el("div", "panel");
  var f1 = el("div", "field");
  f1.appendChild(el("label", null, "API key"));
  var keyIn = el("input");
  keyIn.type = "text";
  keyIn.value = ls(LS_KEY, "");
  keyIn.placeholder = "2b10...";
  keyIn.autocapitalize = "off"; keyIn.autocorrect = "off"; keyIn.spellcheck = false;
  f1.appendChild(keyIn);
  f1.appendChild(el("p", "hint",
    "Free from my.plantnet.org — 500 identifications a day. Stored on this device only, "
    + "never in the app's code."));
  p1.appendChild(f1);

  var f2 = el("div", "field");
  f2.appendChild(el("label", null, "Flora"));
  var proj = el("select");
  /* Only "all" is guaranteed. Anything else depends on what the key's plan
     includes, so the real list is read from the key itself by Check the key
     below rather than guessed at here. */
  function setFloraOptions(list){
    proj.innerHTML = "";
    list.forEach(function(o){
      var op = el("option", null, o[1]);
      op.value = o[0];
      proj.appendChild(op);
    });
    var want = ls(LS_PROJ, PROJ_DEFAULT);
    proj.value = want;
    if(proj.value !== want){          /* saved flora is not in the list any more */
      var op = el("option", null, want + " (not available to this key)");
      op.value = want;
      proj.appendChild(op);
      proj.value = want;
    }
  }
  setFloraOptions([["all", "Everywhere (world flora)"]]);
  f2.appendChild(proj);
  var floraHint = el("p", "hint",
    "Everywhere is the only flora a free key can use. Tap Check the key below to "
    + "see whether this key can reach an Australian flora as well. If a flora is "
    + "picked that the key cannot use, the app falls back to Everywhere on its own "
    + "rather than failing.");
  f2.appendChild(floraHint);
  p1.appendChild(f2);
  s.appendChild(p1);

  var save = el("button", "btn");
  save.type = "button";
  save.textContent = "Save";
  save.onclick = function(){
    lsSet(LS_KEY, keyIn.value.trim());
    lsSet(LS_PROJ, proj.value);
    toast("Saved");
  };
  s.appendChild(save);

  /* Tells you in one tap whether the key works, the quota is gone, or the phone
     simply has no signal — instead of all three looking like "camera broken". */
  var testOut = el("p", "hint");
  var test = el("button", "btn ghost");
  test.type = "button";
  test.textContent = "Check the key";
  test.onclick = function(){
    var k = keyIn.value.trim();
    if(!k){ testOut.textContent = "Enter a key first."; return; }
    testOut.innerHTML = "<span class='spin'></span> Checking…";
    fetch("https://my-api.plantnet.org/v2/projects?api-key=" + encodeURIComponent(k) + "&lang=en")
      .then(function(r){
        if(r.status === 401){ testOut.textContent = "✗ Pl@ntNet rejected that key. Check it was copied in full."; return; }
        if(r.status === 429){ testOut.textContent = "✗ Key is valid but today's 500 identifications are used up."; return; }
        if(!r.ok){ testOut.textContent = "✗ Pl@ntNet returned " + r.status + "."; return; }
        return r.json().then(function(list){
          /* Whatever comes back is exactly what this key is allowed to use, so the
             dropdown is built from it instead of from a guess. A flora that is not
             in here answers 403 at identify time, which is what broke the camera. */
          var opts = [["all", "Everywhere (world flora)"]];
          var au = 0;
          (Array.isArray(list) ? list : []).forEach(function(p){
            var id = p && (p.name || p.id);
            if(!id || id === "all") return;
            var title = (p.title || p.desc || id);
            opts.push([id, title]);
            if(/austral|queensland|new south wales|northern territory|oceania/i.test(id + " " + title)) au++;
          });
          setFloraOptions(opts);
          testOut.textContent = "✓ Key works. " + opts.length + " flora"
            + (opts.length === 1 ? "" : "s") + " available to it"
            + (au ? ", including " + au + " Australian. Pick one above and Save."
                  : ". None of them are Australian on this plan, so leave it on Everywhere.");
        });
      })
      .catch(function(){
        testOut.textContent = "✗ Could not reach Pl@ntNet — no signal, or the phone is offline.";
      });
  };
  s.appendChild(test);
  s.appendChild(testOut);

  s.appendChild(el("h2", "sec", "Appearance"));
  var p2 = el("div", "panel");
  var f3 = el("div", "field");
  f3.appendChild(el("label", null, "Theme"));
  var th = el("select");
  [["auto", "Follow the phone"], ["light", "Light"], ["dark", "Dark"]].forEach(function(o){
    var op = el("option", null, o[1]); op.value = o[0]; th.appendChild(op);
  });
  th.value = ls(LS_THEME, "auto");
  th.onchange = function(){
    lsSet(LS_THEME, th.value);
    applyTheme();
  };
  f3.appendChild(th);
  p2.appendChild(f3);
  s.appendChild(p2);

  s.appendChild(el("h2", "sec", "Data"));
  var p3 = el("div", "panel");
  var dl = el("dl", "kv");
  var m = DATA.meta;
  [["PubCRIS extract", m.built],
   ["Herbicides", m.counts.products.toLocaleString()],
   ["Weeds", m.counts.weeds.toLocaleString()],
   ["Weed × situation × product", m.counts.index.toLocaleString()]].forEach(function(r){
    dl.appendChild(el("dt", null, r[0]));
    dl.appendChild(el("dd", null, r[1]));
  });
  p3.appendChild(dl);
  s.appendChild(p3);

  var misses = lsJson(LS_MISS, []);
  if(misses.length){
    s.appendChild(el("h2", "sec", "Species with no APVMA match"));
    var p4 = el("div", "panel");
    var ul = el("ul", "list");
    misses.slice(0, 20).forEach(function(n){
      var li = el("li", "item");
      li.style.cursor = "default";
      li.appendChild(el("div", "item-sci", n));
      ul.appendChild(li);
    });
    p4.appendChild(ul);
    s.appendChild(p4);
    s.appendChild(el("p", "hint",
      "These were identified but are not in the crosswalk yet. Send the list over and they "
      + "can be added to crosswalk-manual.txt."));
  }

  app.appendChild(s);
}

function applyTheme(){
  var t = ls(LS_THEME, "auto");
  if(t === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", t);
}

/* 2026-09-06: an earlier build pointed every phone at the k-australia flora.
   A free key is not allowed to use it, so the API answered 403 and no photo
   identified at all. Put those phones back on a flora that works. */
(function rescueFlora(){
  var LS_DONE = "stel-weed-flora-fix";
  if(ls(LS_DONE, "")) return;
  if(ls(LS_PROJ, "") === "k-australia") lsSet(LS_PROJ, "all");
  lsSet(LS_DONE, "1");
})();

document.getElementById("btnSettings").onclick = function(){ go("settings"); };
applyTheme();

loadCore().then(function(){
  render();
}).catch(function(err){
  app.innerHTML = "";
  var p = el("div", "panel");
  p.appendChild(el("div", "empty",
    "Could not load the chemical data. If this is the first run, open the app once with "
    + "signal so it can cache. (" + (err && err.message || err) + ")"));
  app.appendChild(p);
});

if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("./sw.js").catch(function(){});
  });
}
